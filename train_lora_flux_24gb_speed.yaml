---
job: extension
config:
  # this name will be the folder and filename name
  name: "data3_twolaye"
  process:
    - type: 'sd_trainer'
      # root folder to save training sessions/samples/weights
      training_folder: "output"
      # uncomment to see performance stats in the terminal every N steps
#      performance_log_every: 1000
      device: cuda:3
      # if a trigger word is specified, it will be added to captions of training data if it does not already exist
      # alternatively, in your captions you can add [trigger] and it will be replaced with the trigger word
      trigger_word: "facefxi2"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
        network_kwargs:
          only_if_contains:
            - "transformer.single_transformer_blocks.9."
            - "transformer.single_transformer_blocks.25."
      save:
        dtype: float16 # precision to save
        save_every: 10000 # save every this many steps
        max_step_saves_to_keep: 4 # how many intermittent saves to keep
        push_to_hub: false #change this to True to push your trained model to Hugging Face.
        # You can either set up a HF_TOKEN env variable or you'll be prompted to log-in         
#       hf_repo_id: your-username/your-model-slug
#       hf_private: true #whether the repo is private or public
      datasets:
        # datasets are a folder of images. captions need to be txt files with the same name as the image
        # for instance image2.jpg and image2.txt. Only jpg, jpeg, and png are supported currently
        # images will automatically be resized and bucketed into the resolution specified
        # on windows, escape back slashes with another backslash so
        # "C:\\path\\to\\images\\folder"
        - folder_path: "./input/data3"
          caption_ext: "txt"
          caption_dropout_rate: 0.05  # will drop out the caption 5% of time
          shuffle_tokens: false  # shuffle caption order, split by commas
          cache_latents_to_disk: true  # leave this true unless you know what you're doing
          resolution: [ 512, 640,768, 1024 ]  # flux enjoys multiple resolutions
      train:
        batch_size: 1
        steps: 2000  # total number of steps to train 500 - 4000 is a good range
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false  # probably won't work with flux
        gradient_checkpointing: true  # need the on unless you have a ton of vram
        noise_scheduler: "flowmatch" # for training only
        optimizer: "adamw8bit"
        lr: 1e-3
        # uncomment this to skip the pre training sample
        skip_first_sample: true
        # uncomment to completely disable sampling
        disable_sampling: false
        # uncomment to use new vell curved weighting. Experimental but may produce better results
#        linear_timesteps: true

        # ema will smooth out learning, but could slow it down. Recommended to leave on.
        ema_config:
          use_ema: true
          ema_decay: 0.99

        # will probably need this if gpu supports it for flux, other dtypes may not work correctly
        dtype: bf16
      model:
        # huggingface model name or path
        name_or_path: "./models/AWPortrait"
        is_flux: true
        quantize: false  # run 8bit mixed precision
        low_vram: false  # uncomment this if the GPU is connected to your monitors. It will use less vram to quantize, but is slower.
      sample:
        sampler: "flowmatch" # must match train.noise_scheduler
        sample_every: 1000 # sample every this many steps
        width: 1024
        height: 1024
        prompts:
          # you can add [trigger] to the prompts here and it will be replaced with the trigger word
#          - "[trigger] holding a sign that says 'I LOVE PROMPTS!'"\
            - "facefxi2, photo of woman"
            - "facefxi2,portrait of woman, smiling"
            - "facefxi2, woman wearing glasses"
            - "facefxi2,realistic photo of woman in a suit"
            # - "photo of facefxi2, looking surprised"
            # - "a close-up of facefxi2, dramatic lighting"
            # - "facefxi2 in front of the Eiffel Tower"
            # - "a cinematic photo of facefxi2, night scene"
            - "facefxi2,selfie of woman wearing a hoodie"
            - "facefxi2, a close-up photo of a young woman looking straight at the camera, natural lighting, indoor background, short black hair, neat eyebrows, calm expression"
            - "facefxi2, a young woman turning slightly to the right, close-up selfie with natural lighting, short spiky hair, clean skin, neutral expression"
            - "facefxi2,a young woman turning slightly to the left, medium-close-up selfie, natural lighting, clean background, soft smile"
            # - "a painting of facefxi2 in renaissance style"
            # - "facefxi2 as a fantasy warrior"
            # - "professional studio photo of facefxi2, soft background"
            # - "school ID photo of facefxi2"
            # - "anime style drawing of facefxi2"
            # - "photo of facefxi2, holding a microphone"
            # - "screenshot of facefxi2 in a video call"
            # - "3D render of facefxi2's face"
            # - "sketch of facefxi2, pencil drawing"
            # - "mugshot of facefxi2"
            # - "passport photo of facefxi2"
          # - "facefxi2, woman with red hair, playing chess at the park, bomb going off in the background"
          # - "facefxi2, a woman holding a coffee cup, in a beanie, sitting at a cafe"
          # - "facefxi2, a horse is a DJ at a night club, fish eye lens, smoke machine, lazer lights, holding a martini"
          # - "facefxi2, a man showing off his cool new t shirt at the beach, a shark is jumping out of the water in the background"
          # - "woman playing the guitar, on stage, singing a song, laser lights, punk rocker"
          # - "hipster man with a beard, building a chair, in a wood shop"
          # - "photo of a man, white background, medium shot, modeling clothing, studio lighting, white backdrop"
          # - "a man holding a sign that says, 'this is a sign'"
          # - "a bulldog, in a post apocalyptic world, with a shotgun, in a leather jacket, in a desert, with a motorcycle"
        neg: ""  # not used on flux
        seed: 42
        walk_seed: true
        guidance_scale: 3.5
        sample_steps: 28
# you can add any additional meta info here. [name] is replaced with config name at top
meta:
  name: "[name]"
  version: '1.0'
